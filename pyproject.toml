[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "statistical-arbitrage-lab"
version = "0.1.0"
description = "A regime-aware, walk-forward research framework for cointegrated pairs trading."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
dependencies = ["numpy>=1.24", "pandas>=2.0", "statsmodels>=0.14"]

[project.optional-dependencies]
dev = ["pytest>=7.4"]

[project.scripts]
statarb-demo = "statarb.demo:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
